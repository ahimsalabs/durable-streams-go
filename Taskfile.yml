# Taskfile for durable-streams-go
# Bootstrap: go run github.com/go-task/task/v3/cmd/task@latest
# https://taskfile.dev/

version: '3'

vars:
  GOFUMPT: go run mvdan.cc/gofumpt@latest
  STATICCHECK: go run honnef.co/go/tools/cmd/staticcheck@latest
  GOLANGCI_LINT: go run github.com/golangci/golangci-lint/cmd/golangci-lint@latest

tasks:

  # ============================================================================
  # Development
  # ============================================================================

  default:
    desc: Run all checks
    deps: [check]

  test:
    desc: Run tests with race detection and coverage
    cmds:
      - go test -race -cover ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - "{{.GOLANGCI_LINT}} run"

  fmt:
    desc: Format code with gofumpt
    cmds:
      - "{{.GOFUMPT}} -w ."

  fmt:check:
    desc: Check code formatting
    cmds:
      - |
        output="$({{.GOFUMPT}} -d .)" || exit $?
        if [ -n "$output" ]; then
          printf '%s\n' "$output"
          exit 1
        fi

  staticcheck:
    desc: Run staticcheck
    cmds:
      - "{{.STATICCHECK}} ./..."

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  check:
    desc: Run all checks (fmt, vet, lint, staticcheck, test)
    cmds:
      - task: fmt:check
      - task: vet
      - task: staticcheck
      - task: lint
      - task: test

  tidy:
    desc: Run go mod tidy
    cmds:
      - go mod tidy

  build:
    desc: Build the package
    cmds:
      - go build ./...

  server:
    desc: Run test server for conformance testing
    cmds:
      - go run ./cmd/testserver -port {{.PORT | default "8788"}}

  conformance:client:
    desc: Run client conformance tests (builds adapter if needed)
    cmds:
      - ./run-conformance-tests.sh {{.CLI_ARGS}}

  conformance:client:verbose:
    desc: Run client conformance tests with verbose output
    cmds:
      - ./run-conformance-tests.sh --verbose {{.CLI_ARGS}}

  conformance:go:
    desc: Run server conformance tests against Go server (memorystorage)
    cmds:
      - task: conformance:go:run
        vars: {STORAGE: memory, PORT: 8788}

  conformance:go:badger:
    desc: Run server conformance tests against Go server (badgerstore)
    cmds:
      - task: conformance:go:run
        vars: {STORAGE: badger, PORT: 8789}

  conformance:go:run:
    internal: true
    cmds:
      # The script owns the server's lifetime and kills it on every exit path,
      # so no process is left holding the port. It cannot be inlined here:
      # Task's built-in shell does not support `trap` for INT/TERM.
      - ./run-server-conformance.sh {{.STORAGE}} {{.PORT}} {{.CLI_ARGS}}


  # ============================================================================
  # Precommit checks (run with: task precommit)
  # ============================================================================

  precommit:
    desc: Run all precommit checks
    deps:
      - fmt:check
    cmds:
      - task: precommit:parallel
      - echo "All precommit checks passed."

  precommit:parallel:
    internal: true
    deps:
      - precommit:test
      - precommit:lint
      - precommit:readme

  precommit:test:
    internal: true
    cmds:
      - cmd: output=$(go test ./... 2>&1) || (echo "$output"; exit 1)
        silent: true

  precommit:lint:
    internal: true
    cmds:
      - cmd: output=$(go vet ./... 2>&1) || (echo "$output"; exit 1)
        silent: true
      - cmd: output=$({{.STATICCHECK}} ./... 2>&1) || (echo "$output"; exit 1)
        silent: true

  precommit:readme:
    internal: true
    cmds:
      - cmd: |
          cp README.md README.md.bak
          go run ./internal/snippet -inject README.md ./durablestream/example_test.go
          if ! diff -q README.md README.md.bak > /dev/null 2>&1; then
            mv README.md.bak README.md
            echo "README.md snippets are out of date. Run 'task readme' to update."
            exit 1
          fi
          rm README.md.bak
        silent: true

  # ============================================================================
  # CI
  # ============================================================================

  ci:local:
    desc: Run GitHub Actions workflow locally via Docker
    cmds:
      - act --container-architecture linux/amd64

  # ============================================================================
  # Documentation
  # ============================================================================

  readme:
    desc: Update README.md code snippets from example files
    cmds:
      - go run ./internal/snippet -inject README.md ./durablestream/example_test.go

  readme:check:
    desc: Check if README.md snippets are up to date
    cmds:
      - |
        cp README.md README.md.bak
        go run ./internal/snippet -inject README.md ./durablestream/example_test.go
        if ! diff -q README.md README.md.bak > /dev/null 2>&1; then
          mv README.md.bak README.md
          echo "README.md snippets are out of date. Run 'task readme' to update."
          exit 1
        fi
        rm README.md.bak
        echo "README.md snippets are up to date."

  readme:lint:
    desc: Check for large code blocks not covered by snippets
    cmds:
      - go run ./internal/snippet -lint README.md

  api:
    desc: Regenerate the ignored local API.md from Go doc comments
    cmds:
      - go doc -all ./durablestream > API.md
